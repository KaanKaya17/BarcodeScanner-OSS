name: Verify Material 3 preview
on:
  push:
    branches: [codex/material-ui-check]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
      - name: Build the app and instrumentation
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Verify screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: python3 scripts/capture-material-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-ui-preview
          path: captures/
          if-no-files-found: error
          retention-days: 7
